server {
    listen 4210;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all unknown routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to monitoring-service backend
    # The Angular app uses relative URL /api/monitoring/logs,
    # nginx forwards it to service-monitoring:8087 inside the docker network.
    # This avoids CORS entirely — same origin from the browser's perspective.
    location /api/monitoring/ {
        proxy_pass         http://service-monitoring:8087/api/monitoring/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
